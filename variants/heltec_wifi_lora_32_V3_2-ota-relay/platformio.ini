[env:heltec_wifi_lora_32_V3_2-ota-relay]
extends = env:heltec_wifi_lora_32_V3_2
build_flags =
    ${env:heltec_wifi_lora_32_V3_2.build_flags}
    -I tools/lora_ota/include
    -D ENABLE_RF_ROUTE
    -D RFOTA_ROUTE_DIAGNOSTICS
    -D RFOTA_BOARD_ID=0x484C5633   ; "HLV3"
    -D RFOTA_LABEL=\"OTA-RELAY\"
