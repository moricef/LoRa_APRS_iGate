[platformio]
default_envs = receiver

[env]
platform = espressif32 @ 6.12.0
board = ttgo-lora32-v21
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
lib_deps = jgromes/RadioLib @ 7.6.0
build_flags = -Wall -Wextra -D RADIOLIB_EXCLUDE_LORAWAN=1

[env:receiver]
build_flags = ${env.build_flags} -D OTA_RECEIVER=1 -D OTA_LABEL=\"lab-a\"

[env:receiver_b]
build_flags = ${env.build_flags} -D OTA_RECEIVER=1 -D OTA_LABEL=\"lab-b\"

[env:bridge]
build_flags = ${env.build_flags} -D OTA_RECEIVER=0 -D OTA_LABEL=\"bridge\"

[env:bridge_fast]
build_flags = ${env.build_flags} -D OTA_RECEIVER=0 -D OTA_LABEL=\"bridge-fast\" -D OTA_BRIDGE_BAUD=921600
